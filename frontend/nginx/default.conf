# nginx site for the JANICE frontend container.
# Serves the built Vue app and forwards API and admin requests to Django.
# Docs: https://nginx.org/en/docs/

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;   # don't advertise the nginx version

    # Security headers, sent with every response (including errors)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API and Django admin -> the backend container
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        include /etc/nginx/conf.d/proxy-hide-headers.inc;
    }

    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/conf.d/proxy-hide-headers.inc;
    }

    # Built files have a content hash in their names, so they can be cached for a year
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # index.html must never be cached, so users always get the latest app
    location = /index.html {
        expires -1;
    }

    # Single-page app: unknown paths return index.html and Vue handles them
    location / {
        try_files $uri $uri/ /index.html;
    }
}
