# Dependabot: weekly pull requests to keep pinned dependencies up to date.
# Docs: https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference
# Note: Dependabot does not support YAML anchors/aliases, so each schedule is written out.
version: 2

updates:
  # GitHub Actions in .github/workflows (updates the pinned SHAs and their version comments)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Africa/Nairobi"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns: ["*"]

  # Python packages in backend/ and pipeline/ (pyproject.toml and uv.lock)
  - package-ecosystem: "uv"
    directories:
      - "/backend"
      - "/pipeline"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Africa/Nairobi"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]

  # Base images in backend/, frontend/ and pipeline/ Dockerfiles
  # (pipeline/Dockerfile also pins the uv image, ghcr.io/astral-sh/uv)
  - package-ecosystem: "docker"
    directories:
      - "/backend"
      - "/frontend"
      - "/pipeline"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Africa/Nairobi"
    commit-message:
      prefix: "build"
    ignore:
      # Python upgrades (3.13 -> 3.14) are deliberate: they also need
      # .python-version and requires-python changed together
      - dependency-name: "python"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # Node major upgrades (24 -> 26) are deliberate: .nvmrc changes too
      - dependency-name: "node"
        update-types: [ "version-update:semver-major" ]

  # Images in compose.yaml
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Africa/Nairobi"
    commit-message:
      prefix: "build"
    ignore:
      # A Postgres major upgrade (18 -> 19) needs a dump and restore: plan it, don't auto-bump
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]

  # Hook versions in .pre-commit-config.yaml
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Africa/Nairobi"
    commit-message:
      prefix: "chore"
    groups:
      pre-commit-hooks:
        patterns: ["*"]

  # npm packages in frontend/package.json and frontend/package-lock.json
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Africa/Nairobi"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      npm-minor-and-patch:
        update-types: [ "minor", "patch" ]
