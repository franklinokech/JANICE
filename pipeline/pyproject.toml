[project]
name = "janice-pipeline"
version = "0.1.0"
description = "JANICE data pipeline: REDCap extract, hashing, loading and synthetic data"
readme = "README.md"
authors = [
    { name = "Franklin Okech", email = "franklinokech@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
# S101: tests use assert. S311: seeded random is intended (reproducible
# synthetic data, never used for security)
"tests/**" = ["S101", "S311"]
