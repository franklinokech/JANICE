[project]
name = "janice-pipeline"
version = "0.1.0"
description = "JANICE data pipeline: REDCap extract, hashing, loading and synthetic data"
readme = "README.md"
authors = [
    { name = "Franklin Okech", email = "franklinokech@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dagster>=1.13.31",
    "duckdb>=2.0.1",
    "httpx>=0.28.1",
    "pydantic>=2.14.4",
    "pyyaml>=6.0.4",
    "tzdata>=2026.6",
]

[project.scripts]
janice-synthetic = "janice_pipeline.synthetic.cli:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "dagster-dg-cli>=1.13.31",
    "dagster-webserver>=1.13.31",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
# S101: tests use assert. S311: seeded random is intended (reproducible
# synthetic data, never used for security)
"tests/**" = ["S101", "S311"]

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "janice_pipeline"
code_location_target_module = "janice_pipeline.definitions"
code_location_name = "janice_pipeline"
