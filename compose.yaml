# Local development stack. Start with: docker compose up -d --build
# Docs: https://docs.docker.com/compose/
name: janice

# Shared settings for every service that runs the backend image
x-backend: &backend
  build: ./backend
  image: janice-backend:dev
  env_file: .env
  environment:
    POSTGRES_HOST: db      # inside Docker, Postgres is reached by its service name
    POSTGRES_PORT: "5432"

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-janice}
      POSTGRES_USER: ${POSTGRES_USER:-janice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    <<: *backend
    command: ["python", "manage.py", "migrate", "--noinput"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    <<: *backend
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: janice-frontend:dev
    ports:
      - "127.0.0.1:${WEB_PORT:-8088}:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
